<html lang="ko">

  <title>OFF THE RECORD | 료타 × 시게오 — 원본 카톡 v9</title>
  <style>
    :root { color-scheme:dark; --cream:#f7f1e9; --ink:#181827; --muted:#a7aaba; --accent:#d9a7ee; --outline:rgba(255,255,255,.13); --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#080b15; color:#fff; font-family:var(--font); }
    button,input { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible { outline:3px solid #eabfff; outline-offset:3px; }
    .page { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:18px; background: radial-gradient(ellipse at 15% 20%,#24213c 0%,transparent 43%),radial-gradient(ellipse at 83% 83%,#1e254b 0%,transparent 45%),#090d18; }
    .device { position:relative; width:min(394px,100%); height:min(842px,calc(100dvh - 30px)); min-height:620px; flex:0 0 auto; overflow:hidden; border:7px solid #292b39; border-radius:51px; box-shadow:0 30px 90px #000a, inset 0 0 0 1px #667088; background:#171728; isolation:isolate; }
    .notch { z-index:40; position:absolute; top:9px; left:50%; transform:translateX(-50%); width:108px; height:27px; background:#08090f; border-radius:22px; pointer-events:none; }
    .status { z-index:39; position:absolute; top:0; left:0; right:0; height:48px; padding:15px 26px 0; display:flex; justify-content:space-between; align-items:flex-start; font-size:13px; font-weight:800; letter-spacing:.15px; pointer-events:none; color:#fff; }
    .sys-icons { display:flex; align-items:center; gap:5px; font-size:12px; }
    .signal { font-size:11px; letter-spacing:-3px; margin-right:2px; }
    .battery { width:20px; height:10px; border:1.5px solid #fff; border-radius:3px; padding:1px; position:relative; margin-left:4px; }
    .battery:before { content:""; position:absolute; width:2px; height:4px; right:-4px; top:2px; background:#fff; border-radius:2px; }
    .battery:after { content:""; display:block; height:100%; width:62%; background:#fff; border-radius:1px; }
    .screen { position:absolute; inset:0; background:#0c1020; overflow:hidden; }
    .content { height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding-bottom:76px; scrollbar-width:none; }
    .content::-webkit-scrollbar { display:none; }
    .home-line { z-index:35; position:absolute; bottom:12px; left:50%; transform:translateX(-50%); height:5px; width:116px; border:0; border-radius:20px; background:#fff; box-shadow:0 1px 2px #0004; }
    .home-line.dark { background:#15151a; }
    .home-line.is-hidden { display:none; }
    .wallpaper { background: radial-gradient(ellipse at 74% 9%,#ce8fa8aa 0%,transparent 35%),radial-gradient(ellipse at 10% 72%,#334a86 0%,transparent 47%),linear-gradient(135deg,#28233d,#131d35 54%,#5b3e58); }
    .wallpaper:before { content:""; position:absolute; width:380px; height:430px; left:-105px; bottom:-100px; border:1px solid #c9d0ff33; border-radius:47% 53% 63% 37%; transform:rotate(-24deg); pointer-events:none; }
    .wallpaper:after { content:""; position:absolute; width:250px; height:250px; right:-125px; top:190px; border:1px solid #fbd1ea4f; border-radius:51% 49% 35% 65%; transform:rotate(35deg); pointer-events:none; }
    .intro { display:flex; flex-direction:column; justify-content:space-between; padding:100px 27px 77px; background: radial-gradient(circle at 60% 20%,#503e61,#11172b 45%,#080d19 86%); }
    .intro .eyebrow { font-size:11px; color:#d9bbeb; letter-spacing:3px; font-weight:800; }
    .intro h1 { font-size:72px; line-height:1; margin:12px 0 17px; letter-spacing:-5px; font-weight:850; }
    .intro .description { line-height:1.9; font-size:15px; color:#ded8e5; }
    .intro .ornament { text-align:center; font-size:110px; filter:drop-shadow(0 14px 35px #d9a7ee55); opacity:.95; margin-top:8px; transform:rotate(-11deg); }
    .intro label { display:block; margin-bottom:10px; font-size:13px; font-weight:750; }
    .name-field { width:100%; border:1px solid #bca2c64d; border-radius:15px; padding:16px; background:#ffffff11; color:#fff; font-size:16px; margin-bottom:12px; }
    .name-field::placeholder { color:#a8a0b5; }
    .primary { width:100%; background:#e5c5f7; border:0; border-radius:15px; padding:16px; font-size:15px; font-weight:800; color:#24182f; }
    .primary:disabled { opacity:.45; cursor:default; }
    .caption { color:#aaa6b4; font-size:11px; text-align:center; line-height:1.5; margin-top:12px; }
    .lock { padding:71px 22px 65px; text-align:center; }
    .lock-day { font-size:17px; font-weight:700; text-shadow:0 1px 8px #0006; }
    .lock-time { font-size:93px; line-height:1.06; letter-spacing:-6px; font-weight:800; text-shadow:0 3px 18px #0003; }
    .lock-spacer { height:16%; }
    .lock-nots { display:grid; gap:9px; text-align:left; }
    .notification { border:0; text-align:left; width:100%; border-radius:17px; background:rgba(245,245,251,.84); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:13px; color:#20202b; display:flex; align-items:flex-start; gap:10px; }
    .notif-icon { width:39px; height:39px; display:grid; place-items:center; flex:none; border-radius:10px; background:#fee500; font-size:22px; }
    .notif-icon.ig { background:linear-gradient(135deg,#ffd55f,#ef5488,#8d55c7); color:white; }
    .notification strong { font-size:13px; display:block; margin:0 0 4px; }
    .notification small { display:block; font-size:12px; line-height:1.45; }
    .lock-bottom { position:absolute; bottom:59px; left:0; right:0; font-size:13px; font-weight:650; display:grid; gap:16px; justify-items:center; }
    .lock-bottom button { background:#ffffff26; color:white; padding:10px 21px; border:1px solid #ffffff35; border-radius:999px; }
    .up-arrow { font-size:25px; line-height:1; }


/* Refactored independent interactive iPhone lock & passcode screens */
.story-lock, .story-pass {position:relative;width:100%;height:100%;overflow:hidden;color:white;background-position:center;background-size:cover;background-repeat:no-repeat;touch-action:pan-y;}
.story-wallpaper {position:absolute;inset:0;background-color:var(--plain-wallpaper);background-image:var(--story-wallpaper);background-size:cover;background-position:center center;}
.story-lock .story-wallpaper::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,4,10,.09),transparent 24%,transparent 78%,rgba(0,0,0,.12));pointer-events:none;}
.story-pass .story-wallpaper::after{content:"";position:absolute;inset:0;background:rgba(6,7,13,.68);pointer-events:none;}
.story-status {position:absolute;top:1.65%;left:7.75%;right:6.2%;display:flex;align-items:center;justify-content:space-between;font-size:clamp(13px,3.55vw,18px);font-weight:780;line-height:1.2;letter-spacing:-.2px;text-shadow:0 1px 2px #0002;}
.story-status .story-bars {display:flex;align-items:center;gap:7px}
.story-status .story-bars svg{display:block;width:18px;height:16px;fill:#fff}
.story-status .story-wifi{font-size:18px;margin-top:-5px;line-height:1}
.story-status .story-battery{height:12px;width:24px;border-radius:3px;border:1.5px solid #fff;position:relative;padding:1.7px}
.story-status .story-battery::before{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:#eee}
.story-status .story-battery::after{content:"";display:block;width:100%;height:100%;background:#fff;border-radius:1px}
.story-lock-symbol{position:absolute;top:5.8%;left:50%;transform:translateX(-50%);width:22px;height:32px;display:grid;place-items:center;}
.story-lock-symbol svg{width:20px;height:27px;fill:white;}
.story-day{position:absolute;top:10.8%;left:0;right:0;text-align:center;font-size:clamp(18px,4.55vw,23px);font-weight:760;text-shadow:0 2px 6px #0003;letter-spacing:-.6px;}
.story-big-time{position:absolute;top:14.6%;left:0;right:0;text-align:center;font-size:clamp(80px,25vw,118px);line-height:1;letter-spacing:-5px;font-weight:750;text-shadow:0 2px 9px #0002;}
.story-notifications{position:absolute;inset:0;pointer-events:none;}
.story-notification{position:absolute;left:2.75%;width:94.5%;border:0;border-radius:21px;min-height:7.8%;padding:11px 13px;display:flex;gap:12px;align-items:center;text-align:left;color:#14141c;background:rgba(242,243,249,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 1px 2px #0001;pointer-events:auto;opacity:0;transform:translateY(-14px) scale(.985);animation:story-alert-in .4s cubic-bezier(.15,.72,.3,1.15) forwards;}
.story-notification.n0{top:31.65%;min-height:10.05%;}.story-notification.n1{top:44.3%;}.story-notification.n2{top:53.8%;}.story-notification.n3{top:63.3%;}.story-notification.n4{top:72.8%;}
.story-notification .story-notif-icon{width:43px;height:43px;object-fit:contain;flex:none;border-radius:11px;}
.story-notif-text{min-width:0;flex:1;font-size:clamp(12px,3.3vw,15px);line-height:1.35;font-weight:500;letter-spacing:-.35px;overflow-wrap:anywhere}
.story-notif-title{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-weight:760;font-size:clamp(13px,3.5vw,16px);margin-bottom:2px;}
.story-notif-title time{font-weight:450;color:#6b6972;font-size:12px;white-space:nowrap}
.story-notif-body{white-space:normal;}
@keyframes story-alert-in{to{opacity:1;transform:translateY(0) scale(1)}}
.story-lock-bottom{position:absolute;bottom:1.25%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:650;text-shadow:0 1px 3px #0004;}
.story-up-arrow{font-size:31px;line-height:.8}.story-unlock-label{border:0;color:white;background:none;font-size:clamp(13px,3.55vw,17px);padding:5px 18px;font-weight:720}
.story-lock-tools{position:absolute;bottom:9.3%;left:11%;right:11%;display:flex;justify-content:space-between}
.story-lock-tool{background:#414247a8;width:49px;height:49px;border:0;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:27px;backdrop-filter:blur(8px)}
.story-lock-tool svg{width:24px;height:27px;stroke:#fff;stroke-width:2.5;fill:none}
.story-white-home{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);height:5px;width:34%;border-radius:99px;background:#fff;pointer-events:none}
.story-lock .story-white-home{bottom:.8%}

    .story-topbar{position:absolute;top:2.2%;left:5.8%;right:5.8%;height:7.5%;display:flex;align-items:flex-start;justify-content:space-between;z-index:3;color:#fff;font-weight:780;letter-spacing:-.2px;pointer-events:none}
    .story-top-left,.story-top-right{display:flex;align-items:center;gap:5px;font-size:clamp(14px,3.9vw,19px);line-height:1}
    .story-top-left{min-width:25%;}
    .story-top-center{position:absolute;left:50%;top:-.2%;transform:translateX(-50%);width:36.4%;height:57%;min-height:36px;max-height:46px;background:#050506;border-radius:999px;display:flex;align-items:center;justify-content:flex-start;padding-left:8%;}
    .story-top-locksvg{width:17px;height:21px;fill:#fff;opacity:.97}
    .story-mute{position:relative;width:17px;height:17px;display:inline-block;margin-left:1px}
    .story-mute:before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border:2px solid #fff;border-right:none;border-radius:2px 0 0 2px}
    .story-mute:after{content:"";position:absolute;left:7px;top:3px;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid #fff}
    .story-mute i{position:absolute;left:4px;top:-1px;width:2.6px;height:19px;background:#fff;border-radius:2px;transform:rotate(-36deg)}
    .story-top-right{min-width:31%;justify-content:flex-end;gap:7px}
    .story-signal{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
    .story-signal span{display:block;width:5px;background:#fff;border-radius:3px}
    .story-signal span:nth-child(1){height:8px}.story-signal span:nth-child(2){height:12px}.story-signal span:nth-child(3){height:16px}.story-signal span:nth-child(4){height:20px}
    .story-net{font-size:clamp(14px,3.7vw,18px);font-weight:780;letter-spacing:-.1px}
    .story-battery-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:33px;padding:0 12px;border-radius:13px;background:rgba(255,245,208,.9);color:#000;font-size:clamp(16px,4.1vw,20px);font-weight:900;line-height:1}
    .story-battery-wrap:after{content:"";position:absolute;right:-4px;top:11px;width:3px;height:10px;border-radius:0 4px 4px 0;background:rgba(255,245,208,.82)}
    .story-date-hero{position:absolute;top:14%;left:0;right:0;text-align:center;font-size:clamp(20px,5vw,28px);font-weight:800;letter-spacing:-.7px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.08)}
    .story-time-hero{position:absolute;top:18.8%;left:0;right:0;text-align:center;font-size:clamp(94px,26vw,130px);line-height:.95;font-weight:900;letter-spacing:-5px;color:rgba(255,247,222,.78);text-shadow:0 1px 0 rgba(255,255,255,.55),0 2px 12px rgba(89,62,20,.12);-webkit-text-stroke:1px rgba(171,146,95,.22)}
    .story-lock-tools{bottom:8.4%;}
    .story-lock-tool{background:rgba(232,225,217,.52);border:1px solid rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
    .story-white-home{bottom:1.1%;width:35%;background:#fff;opacity:.96}
    .story-lock .story-white-home{bottom:1.1%}
    .ios-home-topbar{position:absolute;top:2.2%;left:5.8%;right:5.8%;height:7.5%;z-index:3}
    .ios-home .ios-app-grid{top:16.2%;}
    .ios-home .ios-pages{bottom:20.4%;}
    .ios-home .ios-search{bottom:14.2%;}
    .ios-home .ios-dock{bottom:3%;}

.story-pass-heading{position:absolute;top:12.3%;left:0;right:0;text-align:center;font-size:clamp(21px,5vw,26px);font-weight:770;letter-spacing:-.7px}
.story-pass-dots{position:absolute;top:19.1%;left:50%;transform:translateX(-50%);display:flex;gap:21px}
.story-pass-dot{width:14px;height:14px;border-radius:50%;border:1.6px solid white;display:block;}
.story-pass-dot.filled{background:white}
.story-key{position:absolute;left:var(--key-x);top:var(--key-y);transform:translate(-50%,-50%);width:min(20vw,10.65dvh);height:min(20vw,10.65dvh);max-width:93px;max-height:93px;border:0;border-radius:50%;background:rgba(216,216,224,.24);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);text-shadow:0 1px 2px #0002}
.story-key:active{background:rgba(255,255,255,.42)}
.story-key-num{font-size:clamp(30px,8vw,43px);font-weight:350;line-height:1.05;letter-spacing:-.6px}
.story-key-letters{font-size:clamp(8px,2vw,11px);letter-spacing:3.5px;line-height:1.3;font-weight:650;margin-left:3px}
.story-pass-footer{position:absolute;bottom:5.5%;left:10%;right:10%;display:flex;justify-content:space-between;align-items:center;}
.story-pass-footer button{border:0;background:transparent;color:white;font-size:clamp(13px,3.45vw,17px);font-weight:600;padding:10px 0}
.device.lock-view .notch,.device.lock-view #status,.device.lock-view #home-line{display:none!important}
@media(min-width:521px){.story-key{width:76px;height:76px}.story-pass-heading{font-size:24px}.story-big-time{font-size:102px}}
@media(prefers-reduced-motion:reduce){.story-notification{animation:none;opacity:1;transform:none}}

/* iOS-style home. App icons are individually cropped PNGs, never part of wallpaper. */
.device.home-mode .notch { display:none; }
.device.home-mode .status {display:none;}
.ios-home { position:relative; width:100%; height:100%; padding:0; overflow:hidden; background: #91867e center center / cover no-repeat; }
.ios-home::before {content:"";position:absolute;inset:0;background:linear-gradient(#0000000c,transparent 22%,transparent 80%,#00000010);pointer-events:none;}
.ios-app-grid {position:absolute;top:7.6%;left:4.6%;right:4.6%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:0;row-gap:clamp(26px,3.6vh,36px);}
.ios-app {min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;color:white;text-shadow:0 1px 4px #000a;font-size:clamp(10px,2.85vw,13px);font-weight:500;letter-spacing:-.15px;}
.ios-app img {display:block;width:61%;max-width:68px;height:auto;aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0px 3px 3px #0002);}
.ios-app-label {white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ios-pages {position:absolute;bottom:20%;width:100%;text-align:center;font-size:13px;color:#fff;letter-spacing:3px;text-shadow:0 1px 3px #0005;pointer-events:none;}
.ios-search {position:absolute;left:50%;transform:translateX(-50%);bottom:15.8%;border:0;border-radius:999px;min-width:89px;height:33px;padding:0 17px;color:#fff;background:#5f626488;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);font-size:12px;display:flex;align-items:center;justify-content:center;gap:7px;}
.ios-search svg {width:15px;height:15px;stroke:currentColor;stroke-width:2.9;fill:none;}
.ios-dock {position:absolute;left:2.2%;right:2.2%;bottom:2.8%;height:11.6%;min-height:78px;border-radius:30px;background:#e7e4e087;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;justify-items:center;border:1px solid #ffffff55;}
.ios-dock .ios-app {width:100%;gap:0;}
.ios-dock .ios-app img {width:61%;max-width:68px;}
.ios-dock .ios-app-label {display:none;}

.ios-search-screen input {background:#fff;padding:13px 16px;border:1px solid #dddde1;border-radius:12px;width:100%;font-size:16px;}
.ios-search-results {margin-top:18px;display:grid;gap:8px;}

.ios-search-results img {width:36px;height:36px;object-fit:contain;}
.wallpaper-controls {margin-top:16px;background:#fff;padding:17px;border-radius:15px;}

@media (min-width:521px) {.ios-app {font-size:11px;} .ios-app-grid {row-gap:31px;} }

@media(pointer:fine){.kk-room.keyboard-open .kk-sim-keyboard{display:block;height:188px;background:#d1d4d9;padding:7px 5px 10px;flex:none;color:#20262d}.kk-sim-keyboard .keyrow{display:flex;gap:4px;justify-content:center;margin-bottom:8px}.kk-sim-keyboard .keyrow span{display:grid;place-items:center;height:38px;flex:1;max-width:35px;background:#fff;border-radius:5px;box-shadow:0 1px 1px #0003;font-size:15px}}

/* 메신저 v8: 기존 카톡 디자인은 그대로 두고, 작성창·입력 중 상태만 보완 */
.novel-composer{position:relative;z-index:3;gap:6px;}

.novel-switch{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#666;font-size:23px;width:30px;height:35px;padding:0;}
.novel-reply-popover{position:absolute;z-index:8;bottom:70px;left:28px;right:28px;background:#fff;border-radius:16px;box-shadow:0 5px 30px #0003;padding:6px;max-height:38vh;overflow-y:auto;display:grid;gap:3px;}

.novel-reply-popover button.selected{background:#fbe795;}
.novel-msgtime{align-self:flex-end;flex:none;font-size:9px;font-weight:400;color:#f5f8fa;margin:0 2px 3px;text-shadow:0 1px 2px #48546688;}

.kk-is-typing .kk-balloon span:nth-child(2){animation-delay:.2s}.kk-is-typing .kk-balloon span:nth-child(3){animation-delay:.4s}
@keyframes novel-dot{from{opacity:.3;transform:translateY(2px)}to{opacity:1;transform:translateY(-2px)}}
.novel-call-caption{border-radius:18px;background:#ffffff13;max-width:340px;width:calc(100% - 44px);margin:15px auto;padding:15px 12px;min-height:68px;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.5;color:#fff;}
#live-banner{touch-action:pan-y;will-change:transform,opacity;}


/* 대본 v9 전용: 기존 카카오톡 UI 유지. 첨부 내용은 AI 이미지가 아닌 CSS/텍스트로 표현. */

.novel-file span{font-size:12px;line-height:1.9;display:block;color:#5a5860}

.novel-reply-popover .novel-locked{opacity:.44;background:#e8e8e8;color:#888}

/* v14: 과거/날짜가 바뀐 대화는 카카오톡처럼 날짜 선으로 구분, 무대지시는 비노출 */
.kk-timeline .kk-old-link{display:none!important}

.kk-roomhead .kk-room-actions button.kk-muted{color:#657584}
.kk-row .kk-muted-marker{display:inline;font-size:12px;color:#9ba0a7;font-style:normal;margin-left:5px}
.kk-mute-state{font-size:11px;text-align:center;color:#596b79;padding:0 10px 5px}
.kk-avatar-spacer{width:32px;height:32px;flex:0 0 32px;display:inline-block}
.kk-timeline .kk-message{margin:5px 0;align-items:flex-end}
.kk-timeline .novel-msgtime{font-size:10px;color:#566579;font-weight:400;margin-bottom:4px;text-shadow:none;white-space:nowrap}
.kk-timeline .kk-message .kk-balloon{line-height:1.55}

/* v15: 엔딩은 실제 카톡 말풍선에 넣지 않고 게임 결과 시트로만 안내한다. */
.kk-room{position:relative}
.kk-ended-composer{flex:none;min-height:62px;padding:9px 14px 15px;background:#f2f2f3;border-top:1px solid #cbd3d8;display:flex;align-items:center;justify-content:space-between;gap:9px;color:#68717a;font-size:12px}
.kk-ended-composer button{border:1px solid #d0d5dc;background:#fff;color:#364353;border-radius:13px;padding:9px 13px;font-weight:700;font-size:12px;white-space:nowrap}
.kk-end-scrim{position:absolute;z-index:30;inset:0;background:rgba(12,21,36,.69);display:flex;align-items:center;justify-content:center;padding:23px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.kk-end-sheet{width:min(100%,350px);background:#141d2d;color:#f8f9ff;border:1px solid #ffffff30;box-shadow:0 24px 70px #0007;border-radius:24px;padding:29px 23px 23px;text-align:center}
.kk-end-sheet .ending-eyebrow{display:block;color:#b7bec9;font-size:11px;letter-spacing:2.2px;font-weight:800;margin-bottom:14px}

.kk-end-sheet .ending-primary{background:#ffe66a;color:#252420}
.kk-end-sheet .ending-secondary{background:#ffffff1d;color:#fff;border:1px solid #ffffff35}

/* v17: a pictured club draft in Shigeo's outgoing chat, not an added chat line. */
.novel-press-attach{padding:6px!important;min-width:185px;max-width:224px;display:grid;gap:6px;background:#ffe26a!important;color:#333!important}

<body>
  <div class="page"><main class="device" id="device" aria-label="시게오의 가상 휴대폰 게임">
    <div id="status" class="status photo-status" aria-hidden="true"></div>
    <div id="unified-chrome"></div>
    <section class="screen" id="screen" aria-live="polite"></section>
    <button id="home-line" class="home-line" aria-label="홈 화면으로 돌아가기" title="홈으로 돌아가기" data-act="home"></button>
    <div id="call-surface" role="dialog" aria-label="전화 화면"></div>
    <div id="toast" class="toast" hidden role="status"></div>
    <div id="live-banner" role="status" aria-live="polite"></div>
  </main></div>
  <script>
  (() => {
    'use strict';
    const KEY='ryota-shigeo-if-v3'; // 이전 저장 기록은 그대로 유지
    const WALL_KEY='ryota-shigeo-custom-wallpaper-v1';
    const DEFAULT_STORY_WALLPAPER=null;
    const fresh = () => ({name:'시게오',page:'lock',app:'',sub:'',ending:'',liked:false,chatReplied:false,seenStory:false,seenPhoto:false,seenMemo:false,checkedCall:false,usedHelp:false,lockNotifCount:0,passcode:'',passcodeError:'',xTab:'for-you',likedPosts:[],replyChoice:'',readArticle:false,xSection:'feed',xNotifTab:'all',xDmReply:'',igLikes:[],igSaves:[],igComments:[],igTab:'feed',igReply:'',liveAlertsSeen:0,kkTab:'chats',kkDrafts:{},kkSent:{},kkRead:{},kkLastTime:{},xDmRead:{},xDmSent:{},xDmDrafts:{},kkProfile:'',callMode:'',callContact:'',callMuted:false,callSpeaker:false,callSeconds:0,callDialpad:false});
    let s;
    try { s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}; } catch { s=fresh(); }
    s.page='lock';s.app='';s.sub='';s.lockNotifCount=0;s.passcode='';s.xTab=s.xTab||'for-you';s.likedPosts=s.likedPosts||[];s.xSection='feed';s.igTab='feed';
    s.kkRead=s.kkRead||{};s.kkMuted=s.kkMuted||{};s.kkLastTime=s.kkLastTime||{};s.xDmRead=s.xDmRead||{};s.xDmSent=s.xDmSent||{};s.xDmDrafts=s.xDmDrafts||{};
    const $=id=>document.getElementById(id);
    const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s));}catch{}};
    const mark=k=>{if(!s[k]){s[k]=true;save();}};
    const clues=()=>[s.seenStory,s.seenPhoto,s.seenMemo].filter(Boolean).length;
    const button=(label,act,extra='')=>`<button type="button" data-act="${act}" ${extra}>${label}</button>`;
    let toastHandle;
    const toast=msg=>{ const el=$('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastHandle); toastHandle=setTimeout(()=>el.hidden=true,2900); };
    function go(page,app='',sub=''){const old=s.page;s.page=page;s.app=app;s.sub=sub;if(page==='app'&&app==='chat'&&chatContacts.some(c=>c.id===sub)){novelMarkRead(sub);}save();render();if((page==='home'||page==='app')&&old!=='home'&&old!=='app')startLiveAlerts();if(page==='app'&&app==='chat'&&SIDE_AUTO[sub])novelEnterSide(sub);}
    function header(title,back='home',right='') { return `<header class="app-header"><button class="icon-btn" data-act="${back}" aria-label="뒤로가기">‹</button><h2>${title}</h2><span style="min-width:35px;text-align:right">${right}</span></header>`; }
    const appMap={chat:['카톡','chat','☏'],instagram:['인스타','insta','◎'],gallery:['사진','gallery','✿'],notes:['메모','notes','▤'],phone:['전화','phone','☎'],info:['도움말','info','?']};
    const homeLayout=[
      {id:'stub-x',label:'X',cls:'xapp',act:'open:x'},
      {id:'instagram',label:'Instagram',cls:'insta2',act:'open:instagram'},
      {id:'stub-youtube',label:'YouTube',cls:'youtube',act:'stub:YouTube'},
      {id:'stub-weverse',label:'Weverse',cls:'weverse',act:'stub:Weverse'},
      {id:'gallery',label:'사진',cls:'gallery2',act:'open:gallery'},
      {id:'info',label:'설정',cls:'settings',act:'open:info'}
    ];
    const dockLayout=[
      {id:'phone',label:'전화',cls:'phone2',act:'open:phone'},
      {id:'stub-safari',label:'Safari',cls:'safari',act:'stub:Safari'},
      {id:'stub-message',label:'메시지',cls:'message',act:'stub:메시지'},
      {id:'chat',label:'카카오톡',cls:'kakaotalk',act:'open:chat'}
    ];
    function appIcon(id){let [label,cls,ico]=appMap[id];return `<span class="app-icon ${cls}">${ico}${id==='chat'&&chatContacts.some(c=>novelUnread(c)>0)?'<span class="count">'+chatContacts.filter(c=>novelUnread(c)>0).length+'</span>':''}</span>`;}
    function appButton(id){return `<button class="app-button" data-act="open:${id}">${appIcon(id)}<span>${appMap[id][0]}</span></button>`;}
    function homeAppButton(item,{dock=false}={}){return `<button class="app-button" data-act="${item.act}" aria-label="${item.label} 열기"><span class="app-icon ${item.cls}"></span><span>${item.label}</span></button>`;}
    function intro(){return `<div class="content intro"><div><div class="eyebrow">INTERACTIVE PHONE MYSTERY</div><h1>11:47</h1><p class="description">축제가 끝난 밤, 복도에 떨어진 휴대폰 한 대.<br>잠금화면에 알림이 떠올랐다.<br><br>“그 애를 찾고 싶으면, 마지막 기록을 봐.”</p><div class="ornament" aria-hidden="true">◈</div></div><form id="name-form"><label for="player-name">당신의 이름은?</label><input class="name-field" id="player-name" autocomplete="off" maxlength="12" placeholder="예: 유나" value="${safe(s.name)}" required><button class="primary" type="submit">이야기 시작하기 →</button><div class="caption">실제 카톡·인스타 계정과 연동되지 않는 가상 이야기입니다.<br>진행 상황은 이 기기의 브라우저에만 저장됩니다.</div></form></div>`;}
    
    // Entirely fictional notifications and accounts for this interactive story.
    const alertItems=[
      {kind:'x',title:'X · 속보',time:'06:27',body:'[단독] 야구 국가대표 키쿠치 시게오, 일반인 남성과 열애설',target:'alert:article'},
      {kind:'kakaotalk',title:'료타 선배',time:'06:29',body:'시게오, 일어났어? 기사 봤어. 지금 어디야?',target:'alert:ryota'},
      {kind:'kakaotalk',title:'카토 쇼우',time:'06:30',body:'야 시게오. 괜찮냐? 일단 나한테 답장만 해.',target:'alert:shou'},
      {kind:'x',title:'X · 새로운 언급 28개',time:'06:31',body:'@kikuchi_57 지금 기사 봤음? 팬들한테 할 말 없냐',target:'alert:x-mentions'},
      {kind:'kakaotalk',title:'구단 홍보팀',time:'06:32',body:'키쿠치 선수, 기사 관련해 연락 부탁드립니다.',target:'alert:club'}
    ];
    let alertTimer=null;
    function clearAlertTimer(){if(alertTimer!==null){clearTimeout(alertTimer);alertTimer=null;}}
    function scheduleLockNotifications(){
      clearAlertTimer();
      if(s.page!=='lock'||s.lockNotifCount>=alertItems.length)return;
      alertTimer=setTimeout(()=>{
        if(s.page!=='lock')return;
        s.lockNotifCount=Math.min(alertItems.length,(s.lockNotifCount||0)+1);
        const container=document.querySelector('.story-notifications');
        if(container) container.insertAdjacentHTML('beforeend',notificationMarkup(alertItems[s.lockNotifCount-1],s.lockNotifCount-1));
        save();scheduleLockNotifications();
      },s.lockNotifCount===0?1400:1250);
    }
    function topChrome(locked=false){return `<div class="story-topbar"><div class="story-top-left"><span>LG U+</span><span class="story-mute" aria-hidden="true"><i></i></span></div><div class="story-top-center">${locked ? `<svg class="story-top-locksvg" viewBox="0 0 25 33" aria-hidden="true"><path d="M6 14v-5a6.5 6.5 0 0 1 13 0v5" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="3" y="14" width="19" height="18" rx="4"/></svg>` : ''}</div><div class="story-top-right"><span class="story-signal" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="story-net">LTE</span><span class="story-battery-wrap">20</span></div></div>`;}
    function iosStatus(){return topChrome();}

    function wallpaperCard(){return `<section class="wallpaper-controls"><h3>배경화면 변경</h3><p>사진 선택을 누르면 내 아이폰 사진을 잠금화면·암호화면·홈 화면에 적용할 수 있어요. 원본 아이콘 10개와 앱 배치는 그대로 유지됩니다.</p><div class="wallpaper-preview" id="wallpaper-preview"></div><label for="wallpaper-file" style="display:block;font-weight:700;font-size:13px">내 사진 선택</label><input id="wallpaper-file" type="file" accept="image/*"><button class="secondary" data-act="wallpaper-reset" type="button">무지 배경으로 되돌리기</button><p>선택한 사진은 이 브라우저에만 저장돼요. 다른 사람에게도 같은 배경을 보여주려면 기본 배경 이미지를 웹사이트에 포함해야 해요.</p></section>`;}
    function applyWallpaper(){
      let data=null; try {data=localStorage.getItem(WALL_KEY);} catch(e){}
      const photo = data && /^data:image\/(jpeg|png|webp);base64,/.test(data) ? data : null;
      const homeEl=document.querySelector('.ios-home');
      const previewEl=document.getElementById('wallpaper-preview');
      if(homeEl) homeEl.style.backgroundImage=photo?`url("${photo}")`:'';
      if(previewEl)previewEl.style.backgroundImage=photo?`url("${photo}")`:'';
      document.documentElement.style.setProperty('--story-wallpaper', photo ? `url("${photo}")` : 'none');
    }

      if(a==='flashlight'||a==='camera'){toast('이 기능은 가상 휴대폰 연출입니다.');return;}
      if(a==='x-main'){s.xSection='feed';go('app','x');return;}
      if(a==='x-dm'){go('app','x','dm');return;}
      if(a==='x-follow'){go('app','x','follow');return;}
      if(a==='chat-main'){go('app','chat');return;}
      if(a.startsWith('open:')){go('app',a.split(':')[1]);return;}
      if(a==='lock-screen'){s.lockNotifCount=0;s.passcode='';s.passcodeError='';go('lock');return;}
      if(a==='wallpaper-reset'){try{localStorage.removeItem(WALL_KEY);}catch(e){}render();toast('기본 배경을 적용했어요.');return;}
      if(a.startsWith('stub:')){toast(`${a.slice(5)} 앱은 아직 콘텐츠 제작 전이에요.`);return;}
      if(a.startsWith('stub:')){toast(`${a.split(':')[1]} 앱은 아직 연결되지 않았어요.`);return;}
      if(a.startsWith('chat:')){const id=a.slice(5);s.kkRead[id]=true;novel().seen[id]=true;save();go('app','chat',id);return;}
      if(a==='reply'){mark('chatReplied');render();toast('하린에게 답장을 보냈습니다.');return;}
      if(a==='ig-main'){go('app','instagram');return;}
      if(a==='ig-story'){go('app','instagram','story');toast('단서 1 · 마지막 스토리');return;}
      if(a==='ig-dm'){toast('메시지를 보낼 수 없습니다. 마지막 접속: 11:47');return;}
      if(a==='ig-comment'){toast('이 게시물의 댓글이 제한되었습니다.');return;}
      if(a==='ig-save'){toast('게시물을 저장했습니다.');return;}
      if(a==='like'){s.liked=!s.liked;save();render();return;}
      if(a==='gallery-main'){go('app','gallery');return;}
      if(a.startsWith('photo:')){const n=Number(a.split(':')[1]);go('app','gallery',`photo:${n}`);if(n===1)toast('단서 2 · 방송실 사진');return;}
      if(a==='notes-main'){go('app','notes');return;}
      if(a==='memo-detail'){go('app','notes','detail');toast('단서 3 · 소연의 메모');return;}
      if(a==='memo-ordinary'){toast('리본 · 포스터 · 스피커 · 교실 열쇠');return;}
      if(a==='phone-main'){go('app','phone');return;}
      if(a==='phone-call'){go('app','phone','calling');return;}
      if(a==='call-answer:room'){go('app','phone','partner');return;}
      if(a==='call-answer:roof'){s.ending='roof';go('ending');return;}
      if(a==='ending:good'||a==='ending:alone'){s.ending=a.split(':')[1];go('ending');return;}
      if(a==='replay'){s.ending='';go('home');return;}
      if(a==='reset-confirm'){if(confirm('진행 상황을 모두 지우고 처음부터 시작할까요?')){liveTimers.forEach(clearTimeout);liveTimers=[];liveStarted=false;dismissLiveBanner();stopCall();s=fresh();save();render();}return;}
    }
    // Only swipes that BEGIN at the thin bottom home-indicator zone navigate backwards.
    // Scrolling X, Instagram and KakaoTalk in the message/content region must never navigate.
    let dragStart=null;
    const gestureOrigin=(target,deviceBottom,y)=>{
      const onHomeBar=!!(target instanceof Element && target.closest('#home-line, .story-white-home'));
      return onHomeBar || (deviceBottom-y>=0 && deviceBottom-y<=32);
    };
    $('device').addEventListener('touchstart',e=>{
      if(e.touches.length!==1){dragStart=null;return;}
      const finger=e.touches[0],box=$('device').getBoundingClientRect();
      dragStart={x:finger.clientX,y:finger.clientY,bottom:box.bottom,canGoBack:gestureOrigin(e.target,box.bottom,finger.clientY)};
    },{passive:true});
    $('device').addEventListener('touchcancel',()=>{dragStart=null;},{passive:true});
    $('device').addEventListener('touchend',e=>{
      if(!dragStart||!e.changedTouches.length)return;
      const finger=e.changedTouches[0],dy=dragStart.y-finger.clientY,dx=Math.abs(dragStart.x-finger.clientX);
      const lockSwipe=s.page==='lock'&&dy>65&&dx<65;
      const backSwipe=s.page!=='lock'&&dragStart.canGoBack&&dy>110&&dx<55;
      dragStart=null;
      if(lockSwipe){act('show-passcode');return;}
      if(backSwipe)gestureBack();
    },{passive:true});
    // Mouse gesture matching the exact same bottom 32px zone.
    let mouseStart=null;
    $('device').addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const box=$('device').getBoundingClientRect();mouseStart={x:e.clientX,y:e.clientY,near:gestureOrigin(e.target,box.bottom,e.clientY)};});
    $('device').addEventListener('pointerup',e=>{if(!mouseStart||e.pointerType!=='mouse')return;const dy=mouseStart.y-e.clientY,dx=Math.abs(mouseStart.x-e.clientX),near=mouseStart.near;mouseStart=null;if(s.page==='lock'&&dy>65&&dx<65)act('show-passcode');else if(near&&dy>110&&dx<55)gestureBack();});
    $('screen').addEventListener('input',e=>{
      if(e.target.id==='kk-message-input'){s.kkDrafts=s.kkDrafts||{};s.kkDrafts[s.sub]=e.target.value;return;}
      if(e.target.id==='x-dm-message-input'){s.xDmDrafts[s.sub.slice(3)]=e.target.value;return;}
      if(e.target.id==='ios-app-query') {
        const q=e.target.value.trim().toLowerCase();
        document.querySelectorAll('[data-app-name]').forEach(b=>b.hidden=!b.dataset.appName.includes(q));
      }
    });
    $('screen').addEventListener('focusin',e=>{if(e.target.id==='kk-message-input')document.getElementById('kk-room')?.classList.add('keyboard-open');});
    $('screen').addEventListener('focusout',e=>{if(e.target.id==='kk-message-input'&&!e.relatedTarget?.closest('.kk-send'))document.getElementById('kk-room')?.classList.remove('keyboard-open');});
    $('screen').addEventListener('change', async e=>{
      if(e.target.id!=='wallpaper-file')return;
      const file=e.target.files?.[0];
      if(!file || !file.type.startsWith('image/')){toast('사진 파일을 선택해 주세요.');return;}
      try {
        let image;
        try { image=await createImageBitmap(file); }
        catch(err) {
          const objectUrl=URL.createObjectURL(file);
          try { image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=objectUrl;}); }
          finally { URL.revokeObjectURL(objectUrl); }
        }
        const maxDim=1500;
        let iw=image.width,ih=image.height;
        const scale=Math.min(1,maxDim/Math.max(iw,ih));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(iw*scale));
        canvas.height=Math.max(1,Math.round(ih*scale));
        canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL('image/jpeg',.80);
        localStorage.setItem(WALL_KEY,data);
        go('home');toast('새 배경화면을 적용했어요!');
        if(image.close)image.close();
      } catch(err) {
        toast('사진을 적용하지 못했어요. JPG 또는 PNG 사진을 다시 선택해 주세요.');
      }
    });

    // 손가락으로 위/옆으로 밀면 상단 알림 배너만 닫는다. 다른 화면에는 영향 없음.
    (function(){
      const b=$('live-banner');let start=null,moved=false;
      b.style.touchAction='pan-y';
      b.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;start={x:e.touches[0].clientX,y:e.touches[0].clientY};moved=false;},{passive:true});
      b.addEventListener('touchmove',e=>{if(!start||e.touches.length!==1)return;const dx=e.touches[0].clientX-start.x,dy=e.touches[0].clientY-start.y;if(Math.abs(dx)>8||Math.abs(dy)>8){moved=true;b.style.transform=`translate(${dx}px,${Math.min(0,dy)}px)`;b.style.opacity=String(Math.max(.25,1-Math.max(Math.abs(dx),Math.abs(dy))/145));if(Math.abs(dx)>12||dy< -12)e.preventDefault();}},{passive:false});
      b.addEventListener('touchend',e=>{if(!start)return;const p=e.changedTouches[0],dx=p.clientX-start.x,dy=p.clientY-start.y;if(Math.abs(dx)>55||dy< -45){suppressBannerClick=true;dismissLiveBanner();setTimeout(()=>suppressBannerClick=false,400);}else{b.style.transform='';b.style.opacity='';}start=null;},{passive:true});
      b.addEventListener('touchcancel',()=>{start=null;b.style.transform='';b.style.opacity='';},{passive:true});
      let mx=null;
      b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')mx={x:e.clientX,y:e.clientY};});
      b.addEventListener('pointerup',e=>{if(!mx||e.pointerType!=='mouse')return;const dx=e.clientX-mx.x,dy=e.clientY-mx.y;mx=null;if(Math.abs(dx)>55||dy< -45){suppressBannerClick=true;dismissLiveBanner();setTimeout(()=>suppressBannerClick=false,400);}});
    })();

    render();
    novelResume();
  })();
  </script>
</body>
</html>
